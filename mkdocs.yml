site_name: PrivateLabBench
site_description: Local-first evaluation for scientific machine learning on private data.
site_url: https://dipeshbabu.github.io/private-lab-bench/
repo_url: https://github.com/dipeshbabu/private-lab-bench
repo_name: dipeshbabu/private-lab-bench
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Caco2 model-selection case: case_study.md
  - Concepts: concepts.md
  - Prediction tables: prediction_tables.md
  - Statistical uncertainty: uncertainty.md
  - Sampling units and slice inference: sampling_design.md
  - Evaluation-design audits: evaluation_design.md
  - TDC ADMET integration: tdc_admet.md
  - Matbench materials integration: matbench.md
  - ProteinGym DMS integration: proteingym.md
  - External model validation: external_validation.md
  - Trusted local model scoring: trusted_scoring.md
  - Hidden benchmark ownership: hidden_benchmarks.md
  - Paired model comparison: paired_comparison.md
  - Tasks and plugins: tasks.md
  - Evaluation receipts: evaluation_receipts.md
  - Benchmark packs: benchmark_packs.md
  - Evaluation protocols: protocols.md
  - Cross-site aggregation: aggregation.md
  - Reference/current diagnostics: degradation.md
  - Longitudinal receipt trends: trends.md
  - Privacy: privacy.md
  - Report integrity: report_integrity.md
  - Receipt trust: receipt_trust.md
  - Quality gates: quality_gates.md
  - Public release audit: public_release_audit.md
  - Adapters: ADAPTERS.md
  - Troubleshooting: troubleshooting.md
  - Releases: releases.md
  - Roadmap: roadmap.md
  - Project scope: project_scope.md
