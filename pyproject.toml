[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-lab-bench"
version = "0.1.0"
description = "Local-first evaluation framework for scientific AI models."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dipesh Tharu Mahato" }]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scikit-learn>=1.0",
]

[project.scripts]
privatelabbench = "privatelabbench.cli:main"

[tool.setuptools.packages.find]
include = ["privatelabbench*"]
