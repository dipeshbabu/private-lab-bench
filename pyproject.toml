[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-lab-bench"
version = "0.11.0"
description = "Local-first evaluation for scientific machine learning on private data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dipesh Tharu Mahato" }]
keywords = [
  "scientific machine learning",
  "evaluation",
  "private data",
  "reproducibility",
  "privacy auditing",
  "benchmarking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scikit-learn>=1.0",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/dipeshbabu/private-lab-bench"
Repository = "https://github.com/dipeshbabu/private-lab-bench"
Issues = "https://github.com/dipeshbabu/private-lab-bench/issues"
Changelog = "https://github.com/dipeshbabu/private-lab-bench/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dipeshbabu/private-lab-bench/tree/main/docs"

[project.optional-dependencies]
rdkit = ["rdkit>=2023.9.1"]
dev = [
  "pytest>=7.0",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
]

[project.scripts]
privatelabbench = "privatelabbench.cli:main"
plb = "privatelabbench.cli:main"

[tool.setuptools.packages.find]
include = ["privatelabbench*"]

[tool.setuptools.package-data]
privatelabbench = [
  "data/benchmark_packs/*.md",
  "data/benchmark_packs/*/*.md",
  "data/benchmark_packs/*/*.yaml",
  "data/benchmark_packs/*/*.csv",
  "data/benchmark_packs/*/*.json",
  "data/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
pythonpath = ["."]
