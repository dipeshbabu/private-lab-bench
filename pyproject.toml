[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-lab-bench"
version = "0.10.0"
description = "Local-first evaluation framework for scientific AI models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dipesh Tharu Mahato" }]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scikit-learn>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
rdkit = ["rdkit>=2023.9.1"]
api = [
  "fastapi>=0.103",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.0",
  "cryptography>=41.0",
]
dev = [
  "pytest>=7.0",
  "httpx>=0.24",
]
all = [
  "fastapi>=0.103",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.0",
  "cryptography>=41.0",
  "httpx>=0.24",
]

[project.scripts]
privatelabbench = "privatelabbench.cli:main"

[tool.setuptools.packages.find]
include = ["privatelabbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
pythonpath = ["."]
