project: molecule-rdkit-demo
task: molecules

input:
  path: examples/molecules_demo.csv
  target_column: label
  smiles_column: smiles
  task_type: classification
  test_size: 0.25

model:
  adapter: rdkit_random_forest
  fingerprint: rdkit_morgan
  n_bits: 2048
  radius: 2
  n_estimators: 200

privacy:
  mode: dp
  epsilon: 8.0
  sensitivity: 1.0
  seed: 13

report:
  markdown: reports/molecule_rdkit_eval.md
  json: reports/molecule_rdkit_eval.json
  manifest: reports/molecule_rdkit_manifest.json

audit:
  path: reports/molecule_rdkit_audit.jsonl

# Reviewed release settings for this synthetic example only.
release:
  schema_version: release-policy/v1
  id: synthetic-configs-molecule_eval_rdkit
  enabled: true
  min_samples: 2
  min_cell_size: 2
  require_privacy_audit: false
  include_input_schema: true
