project: tabular-demo
task: tabular

benchmark:
  id: tabular-private-regression
  version: "0.1"
  suite: generic-tabular
  domain: tabular

input:
  path: examples/tabular_predictions_demo.csv
  sample_id_column: sample_id
  require_sample_id: true
  target_column: target
  prediction_column: prediction
  task_type: regression
  slice_columns:
    - site
    - batch
  min_slice_size: 2

privacy:
  mode: none
  seed: 13

report:
  markdown: reports/tabular_demo_eval.md
  json: reports/tabular_demo_eval.json
  manifest: reports/tabular_demo_manifest.json

# Reviewed release settings for this synthetic example only.
release:
  schema_version: release-policy/v1
  id: synthetic-configs-tabular_eval
  enabled: true
  min_samples: 2
  min_cell_size: 2
  require_privacy_audit: false
  include_input_schema: true
  public_benchmark:
    id: tabular-private-regression
    version: '0.1'
    suite: generic-tabular
    domain: tabular
  slices:
    site:
    - a
    - b
    - c
