project: kinase-prediction-demo
workflow: predictions

benchmark:
  id: kinase-private-prediction
  version: "2026.05"
  suite: molecular-property
  domain: molecules

input:
  path: examples/predictions_demo.csv
  target_column: label
  prediction_column: pred
  task_type: regression

privacy:
  mode: dp
  epsilon: 8
  sensitivity: 1
  seed: 13

report:
  markdown: reports/kinase_prediction_eval.md
  json: reports/kinase_prediction_eval.json
  # Optional. Prefer setting PRIVATELABBENCH_SIGNING_SECRET in the environment.
  # signing_secret: replace-with-local-secret

audit:
  path: reports/kinase_prediction_audit.jsonl
