project: kinase-prediction-demo
task: predictions

benchmark:
  id: kinase-private-prediction
  version: "2026.05"
  suite: molecular-property
  domain: molecules

input:
  path: examples/predictions_demo.csv
  sample_id_column: sample_id
  require_sample_id: true
  target_column: label
  prediction_column: pred
  task_type: regression
  slice_columns:
    - series
  min_slice_size: 2

privacy:
  mode: none
  seed: 13
  risk_policy:
    max_level: moderate
    max_member_advantage: 0.35
    max_attack_auc: 0.85

report:
  markdown: reports/kinase_prediction_eval.md
  json: reports/kinase_prediction_eval.json
  manifest: reports/kinase_prediction_manifest.json

audit:
  path: reports/kinase_prediction_audit.jsonl

# Reviewed release settings for this synthetic example only.
release:
  schema_version: release-policy/v1
  id: synthetic-configs-prediction_eval
  enabled: true
  min_samples: 2
  min_cell_size: 2
  require_privacy_audit: false
  include_input_schema: true
  public_benchmark:
    id: kinase-private-prediction
    version: '2026.05'
    suite: molecular-property
    domain: molecules
  slices:
    series:
    - aliphatic
    - amine
    - carbonyl
    - ether
    - halogen
    - ring
    - small
    - sulfur
