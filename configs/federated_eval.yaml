project: multi-lab-demo
task: multi-site

benchmark:
  id: multi-lab-molecule-private
  version: "2026.05"
  suite: molecular-property
  domain: molecules

input:
  client_dir: examples/labs
  target_column: label
  smiles_column: smiles
  task_type: regression
  test_size: 0.25

privacy:
  mode: dp
  epsilon: 8
  sensitivity: 1
  seed: 13
  aggregate_policy:
    min_clients: 3
    min_total_samples: 12
    min_client_samples: 4

report:
  markdown: reports/multi_lab_eval.md
  json: reports/multi_lab_eval.json
  manifest: reports/multi_lab_manifest.json

# Reviewed release settings for this synthetic example only.
release:
  schema_version: release-policy/v1
  id: synthetic-configs-federated_eval
  enabled: true
  min_samples: 2
  min_cell_size: 2
  require_privacy_audit: false
  include_input_schema: true
  public_benchmark:
    id: multi-lab-molecule-private
    version: '2026.05'
    suite: molecular-property
    domain: molecules
