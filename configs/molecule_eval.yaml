project: molecule-baseline-demo
task: molecules

benchmark:
  id: molecule-baseline-private
  version: "2026.05"
  suite: molecular-property
  domain: molecules

input:
  path: examples/molecules_demo.csv
  target_column: label
  smiles_column: smiles
  task_type: regression
  test_size: 0.25

privacy:
  mode: dp
  epsilon: 8
  sensitivity: 1
  seed: 13
  risk_policy:
    max_level: moderate
    max_member_advantage: 0.35
    max_attack_auc: 0.85

report:
  markdown: reports/molecule_baseline_eval.md
  json: reports/molecule_baseline_eval.json
  manifest: reports/molecule_baseline_manifest.json

# Reviewed release settings for this synthetic example only.
release:
  schema_version: release-policy/v1
  id: synthetic-configs-molecule_eval
  enabled: true
  min_samples: 2
  min_cell_size: 2
  require_privacy_audit: false
  include_input_schema: true
  public_benchmark:
    id: molecule-baseline-private
    version: '2026.05'
    suite: molecular-property
    domain: molecules
