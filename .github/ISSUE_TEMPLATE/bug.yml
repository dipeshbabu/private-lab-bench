name: Bug report
description: Report a reproducible defect in PrivateLabBench.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include private datasets, credentials, signing secrets, or unpatched security-vulnerability details. Security reports belong in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer a tiny synthetic example, config, and exact command.
      placeholder: |
        plb ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.11.0 or git SHA"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Python 3.10
        - Python 3.11
        - Python 3.12
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove private paths/data/secrets before pasting logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed private data, credentials, and secrets from this issue.
          required: true
