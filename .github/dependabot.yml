version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Compatibility matrices and frozen reference environments are test fixtures.
    # Regenerate their Python-specific pins deliberately; never raise the lower line.
    exclude-paths: ["constraints/**"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels: [dependencies, needs-triage]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The legacy TDC reference stack needs an explicit compatibility/parity review.
      - dependency-name: pytdc
      - dependency-name: huggingface-hub
      - dependency-name: setuptools
      # Range widening can remove TDC's upper bounds even on a minor update.
      # Review these shared dependencies manually against the frozen reference stack.
      - dependency-name: numpy
      - dependency-name: pandas
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels: [dependencies, ci, needs-triage]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels: [dependencies, ci, needs-triage]
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels: [dependencies, ci, needs-triage]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Keep the tested Python minor line; review runtime upgrades separately.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
