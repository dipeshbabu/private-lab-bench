name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Prepare output directories
        run: mkdir -p outputs reports
      - name: Run tests
        run: pytest -q
      - name: List registered tasks and packs
        run: |
          plb list-tasks
          plb list-tasks | grep -q predictions
          plb list-tasks | grep -q tabular
          plb list-tasks | grep -q molecules
          plb list-tasks | grep -q multi-site
          plb list-packs | grep -q community-tabular-regression
          plb list-packs | grep -q community-proteins-binary
          plb list-protocols | grep -q plb://generic/regression@1.0.0
          plb show-protocol plb://generic/binary@1.0.1
      - name: Smoke test prediction CLI
        run: |
          plb eval-predictions examples/predictions_demo.csv --target label --prediction-column pred --privacy metric_perturbation --epsilon 8 --report outputs/ci_prediction_report.md --json-report outputs/ci_prediction_report.json
          test -f outputs/ci_prediction_report.md
          test -f outputs/ci_prediction_report.json
          plb verify-report outputs/ci_prediction_report.json
      - name: Smoke test config runner
        run: |
          plb validate-config configs/prediction_eval.yaml
          plb run configs/prediction_eval.yaml
          test -f reports/kinase_prediction_eval.md
          test -f reports/kinase_prediction_eval.json
          test -f reports/kinase_prediction_audit.jsonl
          test -f reports/kinase_prediction_manifest.json
          test ! -f reports/kinase_prediction_receipt.shareable.json
          test -f reports/kinase_prediction_receipt.shareable.release-audit.json
          python -c "import json; p=json.load(open('reports/kinase_prediction_receipt.shareable.release-audit.json')); assert p['decision']=='deny'; assert 'upstream_release_gate_not_passed' in p['reason_codes']"
      - name: Smoke test non-molecular task
        run: |
          plb validate-config configs/tabular_eval.yaml
          plb run configs/tabular_eval.yaml
          test -f reports/tabular_demo_eval.json
          test -f reports/tabular_demo_manifest.json
          test -f reports/tabular_demo_receipt.shareable.json
          plb verify reports/tabular_demo_receipt.shareable.json
      - name: Smoke test signed local report
        env:
          PRIVATELABBENCH_SIGNING_SECRET: ci-secret
        run: |
          plb run configs/tabular_eval.yaml
          plb verify reports/tabular_demo_receipt.shareable.json --signing-secret ci-secret
          plb verify-manifest reports/tabular_demo_manifest.json --signing-secret ci-secret

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/plb-wheel
          /tmp/plb-wheel/bin/python -m pip install --upgrade pip
          /tmp/plb-wheel/bin/pip install dist/*.whl
      - name: Smoke test installed wheel outside checkout
        working-directory: /tmp
        run: |
          /tmp/plb-wheel/bin/plb --help
          /tmp/plb-wheel/bin/plb list-tasks | grep -q predictions
          /tmp/plb-wheel/bin/plb list-packs | grep -q community-molecules-regression
          /tmp/plb-wheel/bin/plb list-packs | grep -q community-proteins-binary
          /tmp/plb-wheel/bin/plb list-protocols | grep -q plb://generic/regression@1.0.0
          /tmp/plb-wheel/bin/plb show-protocol plb://generic/binary@1.0.1
          PLB_WHEEL_PREDICTIONS=$(/tmp/plb-wheel/bin/python -c "from privatelabbench.benchmark_packs import get_benchmark_pack; print(get_benchmark_pack('community-tabular-regression@1.0.0').predictions_path)")
          /tmp/plb-wheel/bin/plb evaluate "$PLB_WHEEL_PREDICTIONS" --task-type regression --resamples 100 --output-dir /tmp/plb-simple-evaluation
          /tmp/plb-wheel/bin/plb verify /tmp/plb-simple-evaluation/evaluation_receipt.json
          /tmp/plb-wheel/bin/plb run-pack community-tabular-regression@1.0.0
          /tmp/plb-wheel/bin/plb verify reports/benchmark_packs/tabular_regression_receipt.shareable.json

  chemical-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional chemistry adapter
        run: pip install -e '.[dev,rdkit]'
      - name: Test split audits and chemical adapters
        run: pytest -q tests/test_design_audit.py tests/test_molecule_eval.py tests/test_adapters_and_compare.py tests/test_benchmark_packs.py

  tdc-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional TDC reference environment
        run: pip install -e '.[dev,tdc]'
      - name: Check adapter contracts and upstream metric agreement
        run: pytest -q tests/test_tdc_integration.py

  matbench-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional materials tooling
        run: pip install -e '.[dev,matbench]'
      - name: Install the pinned corrected upstream scorer
        run: |
          python scripts/fetch_matbench_reference.py --output-dir "$RUNNER_TEMP/matbench-reference"
          pip install --no-deps --force-reinstall "$RUNNER_TEMP/matbench-reference"
      - name: Check fold contracts and actual upstream metric agreement
        run: pytest -q tests/test_matbench_integration.py

  proteingym-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional protein baseline tooling
        run: pip install -e '.[dev,proteingym]'
      - name: Check assay contracts, tied ranks, and scoped uncertainty
        run: pytest -q tests/test_proteingym_integration.py tests/test_spearman_metrics.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build docs site
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'
          mkdocs build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build local runner image
        run: docker build -t privatelabbench:ci .
      - name: Smoke test Docker runner
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm -v "$PWD/reports:/app/reports" privatelabbench:ci validate-config configs/prediction_eval.yaml
          docker run --rm -v "$PWD/reports:/app/reports" privatelabbench:ci run configs/prediction_eval.yaml
          test -f reports/kinase_prediction_eval.md
          test -f reports/kinase_prediction_eval.json
          test -f reports/kinase_prediction_manifest.json
