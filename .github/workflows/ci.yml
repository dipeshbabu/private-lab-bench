name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install quality tooling
        run: python -m pip install 'pre-commit>=4,<5'
      - name: Set up Node for automation tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check Ruff and repository hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Test issue and PR labeling
        run: node --test .github/scripts/auto-label.test.cjs
      - name: Validate workflow expressions and job contexts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: ubuntu-latest, python-version: "3.15"}
          - {os: ubuntu-latest, python-version: "3.14t"}
          - {os: ubuntu-latest, python-version: "3.15t"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.15"}
          - {os: windows-latest, python-version: "3.14t"}
          - {os: windows-latest, python-version: "3.15t"}
          - {os: macos-15-intel, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.15"}
          - {os: macos-latest, python-version: "3.14t"}
          - {os: macos-latest, python-version: "3.15t"}
          - {os: ubuntu-24.04-arm, python-version: "3.14"}
          - {os: windows-11-arm, python-version: "3.14"}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        if: matrix.os != 'windows-11-arm'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Build ARM64 OpenSSL for the signing dependency
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgTool = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkgTool install openssl:arm64-windows-static-md --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 OpenSSL build failed' }
          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/arm64-windows-static-md'
          "OPENSSL_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'OPENSSL_STATIC=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the full ARM64 development environment
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 development installation failed' }
          python -c 'from cryptography.hazmat.backends.openssl.backend import backend; print(backend.openssl_version_text())'
      - name: Prepare output directories
        run: mkdir -p outputs reports
      - name: Run tests
        run: pytest -q --cov --cov-report=json:coverage.json
      - name: List registered tasks and packs
        run: |
          plb list-tasks
          plb list-tasks | grep -q predictions
          plb list-tasks | grep -q tabular
          plb list-tasks | grep -q molecules
          plb list-tasks | grep -q multi-site
          plb list-packs | grep -q community-tabular-regression
          plb list-packs | grep -q community-proteins-binary
          plb list-protocols | grep -q plb://generic/regression@1.0.0
          plb show-protocol plb://generic/binary@1.0.1
      - name: Smoke test prediction CLI
        run: |
          plb eval-predictions examples/predictions_demo.csv --target label --prediction-column pred --privacy metric_perturbation --epsilon 8 --report outputs/ci_prediction_report.md --json-report outputs/ci_prediction_report.json
          test -f outputs/ci_prediction_report.md
          test -f outputs/ci_prediction_report.json
          plb verify-report outputs/ci_prediction_report.json
      - name: Smoke test config runner
        run: |
          plb validate-config configs/prediction_eval.yaml
          plb run configs/prediction_eval.yaml
          test -f reports/kinase_prediction_eval.md
          test -f reports/kinase_prediction_eval.json
          test -f reports/kinase_prediction_audit.jsonl
          test -f reports/kinase_prediction_manifest.json
          test ! -f reports/kinase_prediction_receipt.shareable.json
          test -f reports/kinase_prediction_receipt.shareable.release-audit.json
          python -c "import json; p=json.load(open('reports/kinase_prediction_receipt.shareable.release-audit.json')); assert p['decision']=='deny'; assert 'upstream_release_gate_not_passed' in p['reason_codes']"
      - name: Smoke test non-molecular task
        run: |
          plb validate-config configs/tabular_eval.yaml
          plb run configs/tabular_eval.yaml
          test -f reports/tabular_demo_eval.json
          test -f reports/tabular_demo_manifest.json
          test -f reports/tabular_demo_receipt.shareable.json
          plb verify reports/tabular_demo_receipt.shareable.json
      - name: Smoke test signed local report
        env:
          PRIVATELABBENCH_SIGNING_SECRET: ci-secret
        run: |
          plb run configs/tabular_eval.yaml
          plb verify reports/tabular_demo_receipt.shareable.json --signing-secret ci-secret
          plb verify-manifest reports/tabular_demo_manifest.json --signing-secret ci-secret

      - name: Retain full-suite coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.json

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/plb-wheel
          /tmp/plb-wheel/bin/python -m pip install --upgrade pip
          /tmp/plb-wheel/bin/pip install dist/*.whl
      - name: Smoke test installed wheel outside checkout
        working-directory: /tmp
        run: |
          /tmp/plb-wheel/bin/plb --help
          /tmp/plb-wheel/bin/plb list-tasks | grep -q predictions
          /tmp/plb-wheel/bin/plb list-packs | grep -q community-molecules-regression
          /tmp/plb-wheel/bin/plb list-packs | grep -q community-proteins-binary
          /tmp/plb-wheel/bin/plb list-protocols | grep -q plb://generic/regression@1.0.0
          /tmp/plb-wheel/bin/plb show-protocol plb://generic/binary@1.0.1
          PLB_WHEEL_PREDICTIONS=$(/tmp/plb-wheel/bin/python -c "from privatelabbench.benchmark_packs import get_benchmark_pack; print(get_benchmark_pack('community-tabular-regression@1.0.0').predictions_path)")
          /tmp/plb-wheel/bin/plb evaluate "$PLB_WHEEL_PREDICTIONS" --task-type regression --resamples 100 --output-dir /tmp/plb-simple-evaluation
          /tmp/plb-wheel/bin/plb verify /tmp/plb-simple-evaluation/evaluation_receipt.json
          /tmp/plb-wheel/bin/plb run-pack community-tabular-regression@1.0.0
          /tmp/plb-wheel/bin/plb verify reports/benchmark_packs/tabular_regression_receipt.shareable.json

  minimum-dependencies:
    name: minimum-dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
      - name: Install the lower dependency line
        run: pip install --constraint constraints/minimum.txt -e '.[dev]'
      - name: Run the complete base suite against older numerical APIs
        run: pytest -q --cov --cov-report=json:coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-minimum-${{ matrix.os }}
          path: coverage.json

  optional-backend:
    name: optional-backend (${{ matrix.os }}, ${{ matrix.extra }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        extra: [opendp, rdkit, proteingym, matbench, tdc]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.extra == 'tdc' && '3.11' || '3.12' }}
      - name: Install the selected optional backend
        run: pip install -e '.[dev,${{ matrix.extra }}]'
      - name: Exercise the actual optional implementation
        run: |
          case '${{ matrix.extra }}' in
            tdc)
              python -c 'import tdc'
              pytest -q --cov --cov-report=json:coverage.json tests/test_tdc_integration.py
              ;;
            opendp)
              python -c 'import opendp.prelude'
              pytest -q --cov --cov-report=json:coverage.json tests/test_opendp_backend.py tests/test_privacy_mechanisms.py
              ;;
            rdkit)
              python -c 'import rdkit'
              pytest -q --cov --cov-report=json:coverage.json tests/test_design_audit.py tests/test_molecule_eval.py tests/test_adapters_and_compare.py
              ;;
            proteingym)
              python -c 'import Bio'
              pytest -q --cov --cov-report=json:coverage.json tests/test_proteingym_integration.py tests/test_spearman_metrics.py
              ;;
            matbench)
              python scripts/fetch_matbench_reference.py --output-dir "$RUNNER_TEMP/matbench-reference"
              pip install --no-deps --force-reinstall "$RUNNER_TEMP/matbench-reference"
              python -c 'import matminer, matbench'
              pytest -q --cov --cov-report=json:coverage.json tests/test_matbench_integration.py
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-extra-${{ matrix.os }}-${{ matrix.extra }}
          path: coverage.json

  chemical-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install optional chemistry adapter
        run: pip install -e '.[dev,rdkit]'
      - name: Test split audits and chemical adapters
        run: pytest -q --cov --cov-report=json:coverage.json tests/test_design_audit.py tests/test_molecule_eval.py tests/test_adapters_and_compare.py tests/test_benchmark_packs.py
      - name: Retain backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-chemical-audit
          path: coverage.json

  tdc-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install optional TDC reference environment
        run: pip install -e '.[dev,tdc]'
      - name: Check adapter contracts and upstream metric agreement
        run: pytest -q --cov --cov-report=json:coverage.json tests/test_tdc_integration.py
      - name: Retain backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tdc-adapter
          path: coverage.json

  matbench-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional materials tooling
        run: pip install -e '.[dev,matbench]'
      - name: Install the pinned corrected upstream scorer
        run: |
          python scripts/fetch_matbench_reference.py --output-dir "$RUNNER_TEMP/matbench-reference"
          pip install --no-deps --force-reinstall "$RUNNER_TEMP/matbench-reference"
      - name: Check fold contracts and actual upstream metric agreement
        run: pytest -q --cov --cov-report=json:coverage.json tests/test_matbench_integration.py
      - name: Retain backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-matbench-adapter
          path: coverage.json

  proteingym-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install optional protein baseline tooling
        run: pip install -e '.[dev,proteingym]'
      - name: Check assay contracts, tied ranks, and scoped uncertainty
        run: pytest -q --cov --cov-report=json:coverage.json tests/test_proteingym_integration.py tests/test_spearman_metrics.py
      - name: Retain backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-proteingym-adapter
          path: coverage.json

  opendp-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenDP and the package
        run: pip install -e '.[dev,opendp]'
      - name: Require the real OpenDP backend and test privacy contracts
        run: |
          python -c "import opendp.prelude"
          pytest -q --cov --cov-report=json:coverage.json tests/test_opendp_backend.py tests/test_privacy_mechanisms.py
      - name: Retain backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-opendp-backend-${{ matrix.python-version }}
          path: coverage.json

  sandbox-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install the package
        run: pip install -e '.[dev]'
      - name: Install pinned gVisor runtime
        run: |
          # Immutable asset for release-20261102.0; verify its bytes below.
          curl --fail --location --retry 3 --silent --show-error \
            --header 'Accept: application/octet-stream' \
            https://api.github.com/repos/google/gvisor/releases/assets/703317093 \
            --output "$RUNNER_TEMP/gvisor.tar.bz2"
          python -c "import hashlib, os, pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'gvisor.tar.bz2'; assert hashlib.sha256(p.read_bytes()).hexdigest() == '6f6b1a8f0f4665a403238135167d0d990bfaeaff5544abf68f5e0d822b35484a'"
          sudo tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          runsc --version
      - name: Prepare reviewed test runtime
        run: |
          docker pull python:3.11-slim-bookworm
          echo "PLB_SANDBOX_IMAGE=$(docker image inspect python:3.11-slim-bookworm --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Test actual inference, isolation, resource attacks, and cleanup
        env:
          PLB_SANDBOX_TESTS: "1"
          PLB_HOST_SECRET: "host-only-integration-sentinel"
        run: pytest -q --cov --cov-report=json:coverage.json tests/test_sandbox.py tests/test_sandbox_runtime.py tests/test_sandbox_package.py tests/test_sandbox_package_runtime.py
      - name: Retain backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-sandbox-runtime
          path: coverage.json

  onboarding-pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the walkthrough
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install the released wheel, not the checkout
        run: |
          python -m pip install --upgrade --no-cache-dir --only-binary=:all: private-lab-bench
      - name: Copy only the example outside the repository
        run: |
          mkdir "$RUNNER_TEMP/plb-onboarding"
          cp examples/first_run.py "$RUNNER_TEMP/plb-onboarding/first_run.py"
      - name: Run the first session against the actual PyPI package
        working-directory: ${{ runner.temp }}/plb-onboarding
        run: |
          python -c "from importlib.metadata import version; from pathlib import Path; import privatelabbench; assert version('private-lab-bench') == privatelabbench.__version__; assert 'site-packages' in Path(privatelabbench.__file__).parts"
          python first_run.py --output-dir local
          plb verify local/evaluation/evaluation_receipt.json
          python first_run.py --output-dir approved --share-synthetic
          plb verify approved/evaluation/evaluation_receipt.shareable.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Build docs site
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'
          mkdocs build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build local runner image
        run: docker build -t privatelabbench:ci .
      - name: Smoke test Docker runner
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm -v "$PWD/reports:/app/reports" privatelabbench:ci validate-config configs/prediction_eval.yaml
          docker run --rm -v "$PWD/reports:/app/reports" privatelabbench:ci run configs/prediction_eval.yaml
          test -f reports/kinase_prediction_eval.md
          test -f reports/kinase_prediction_eval.json
          test -f reports/kinase_prediction_manifest.json

  coverage-gate:
    needs: [test, minimum-dependencies, optional-backend, chemical-audit, tdc-adapter, matbench-adapter, proteingym-adapter, opendp-backend, sandbox-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports/
      - name: Require all reports and enforce combined statement/branch floors
        run: python scripts/check_coverage.py --reports-dir coverage-reports --minimum-reports 46 --statement-floor 85 --branch-floor 75
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: combined-coverage
          path: combined-coverage.json
