name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Smoke test molecule CLI
        run: |
          privatelabbench eval-molecules examples/molecules_demo.csv --target label --privacy dp --epsilon 8 --report outputs/ci_molecule_report.md
          test -f outputs/ci_molecule_report.md

      - name: Smoke test federated CLI
        run: |
          privatelabbench eval-federated examples/labs --target label --privacy dp --epsilon 8 --report outputs/ci_federated_report.md
          test -f outputs/ci_federated_report.md

      - name: Smoke test prediction CLI
        run: |
          privatelabbench eval-predictions examples/predictions_demo.csv --target label --prediction-column pred --privacy dp --epsilon 8 --report outputs/ci_prediction_report.md --json-report outputs/ci_prediction_report.json
          test -f outputs/ci_prediction_report.md
          test -f outputs/ci_prediction_report.json
