name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Enforce recorded release prerequisites
        run: python scripts/check_release_readiness.py "${GITHUB_REF_NAME#v}"
      - name: Require all main-branch workflows and jobs for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME#v}"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_core_distributions.py --dist-dir dist --constraints constraints/core.txt --work-dir "$RUNNER_TEMP/release-installed-checks"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release with distributions and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum -- *.whl *.tar.gz > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.whl ./*.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$RELEASE_TAG"
