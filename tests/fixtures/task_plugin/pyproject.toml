[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plb-ci-task-plugin"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["private-lab-bench>=0.1.5"]

[project.entry-points."privatelabbench.tasks"]
ci-fixture = "plb_ci_task_plugin:provider"

[tool.setuptools]
py-modules = ["plb_ci_task_plugin"]
